[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/projects/:slug"
  to = "/projects/:slug/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
